<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TechAvı — Fiyat Radar</title>
  <meta name="description" content="Trendyol, Hepsiburada ve n11 fiyatlarını tek yerde karşılaştır.">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">TECH<span>AV</span>I</a>
  <div class="account" id="account"></div>
</header>

<main>
  <section class="hero">
    <div class="eyebrow">CANLI FİYAT RADARI</div>
    <h1>Aradığın ürünü bul.<br><span>En uygun fiyatı yakala.</span></h1>
    <p>Trendyol, Hepsiburada ve n11 sonuçlarını tek ekranda karşılaştır.</p>
    <form id="searchForm" class="search">
      <input id="query" autocomplete="off" placeholder="Örn. LEGO Technic Supra MK4, ASUS TUF, RTX 5070..." />
      <button>🔎 Ara</button>
    </form>
    <div class="hint">API key girmen gerekmez. TechAvı veriyi sunucu tarafından getirir.</div>
  </section>

  <section class="stores">
    <div class="store-card"><b>Trendyol</b><span id="count-trendyol">Hazır</span></div>
    <div class="store-card"><b>Hepsiburada</b><span id="count-hepsiburada">Hazır</span></div>
    <div class="store-card"><b>n11</b><span id="count-n11">Hazır</span></div>
  </section>

  <section class="toolbar">
    <h2 id="resultTitle">Sonuçlar</h2>
    <div id="status"></div>
  </section>
  <section id="results" class="grid"></section>
</main>

<div id="authModal" class="modal hidden">
  <div class="modal-box">
    <button class="x" data-close="authModal">×</button>
    <div id="authContent"></div>
  </div>
</div>

<div id="alarmModal" class="modal hidden">
  <div class="modal-box">
    <button class="x" data-close="alarmModal">×</button>
    <h2>🔔 Fiyat Alarmı</h2>
    <p id="alarmProduct"></p>
    <label>Hedef fiyat (TL)</label>
    <input id="targetPrice" type="number" min="1" step="0.01" placeholder="1800">
    <button id="saveAlarm" class="primary">Alarmı Kur</button>
    <div id="alarmMsg" class="msg"></div>
  </div>
</div>

<div id="alarmsModal" class="modal hidden">
  <div class="modal-box wide">
    <button class="x" data-close="alarmsModal">×</button>
    <h2>🔔 Alarmlarım</h2>
    <div id="alarmList"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
